name: yamari
description: "A drink app."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_nav_bar: ^5.0.6
  provider:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: SourGummy
      fonts:
        - asset: fonts/static/SourGummy-Regular.ttf

  assets:
    - lib/images/cherry_orange.png
    - lib/images/cherry.png
    - lib/images/grapefruit.png
    - lib/images/mango_orange.png
    - lib/images/orange.png
    - lib/images/peach.png
    - lib/images/pink_grapefruit.png
    - lib/images/strawberry_kiwi.png
    - lib/images/watermelon.png
    - lib/images/yamari_official.png
    - lib/images/yamari.png
